ext {
    kmkVersionCode = 1
    extName = 'Kavita'
    extClass = '.KavitaFactory'
    extVersionCode = 26
    isNsfw = false
}

apply from: "$rootDir/common.gradle"

dependencies {
//    implementation("org.apache.commons:commons-text:1.14.0")
//    implementation(libs.lib.i18n)
    implementation project(':lib:i18n')
    implementation(libs.commons.text)

    // JVM unit tests (./gradlew :src:all:kavita:testDebugUnitTest) — not packaged into the APK.
    // okhttp is compileOnly on the main source set; tests need it at runtime for OpdsUrlParser.
    testImplementation(libs.junit)
    testImplementation(libs.kotlin.stdlib)
    testImplementation(libs.okhttp)
}
