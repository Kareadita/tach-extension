name: Create Release on Version Bump

# Couplings (change together):
#  - workflows: ["CI"] must match `name:` in build_push.yml. A rename silently
#    stops releases (no failed run).
#  - CI uploads individual-apks-* containing *-release.apk. If that stops
#    matching, releases silently fall back to the repo branch APK.
#  - extVersionCode/kmkVersionCode lines in src/all/kavita/build.gradle and
#    versionCode = extVersionCode + kmkVersionCode (common.gradle).
#  - CI artifacts expire after 1 day; later re-runs use the repo branch.

# Runs after CI succeeds. Prefer the APK artifact from that CI run; fall back to
# the repo branch (manual dispatch, or rescue when the module was not rebuilt).
#
# Detection is not limited to the exact bump push: a later successful CI may
# finish the release if the tag still does not exist. Notes prefer
# last-v-tag..HEAD (falls back to previous bump) so a cancelled intermediate
# bump does not drop PR text. CI concurrency is owned by the CI workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force:
        description: "Force a release even if no extVersionCode bump is detected"
        type: boolean
        default: false
      dry_run:
        description: "Compute notes and version but do not create the GitHub Release"
        type: boolean
        default: false

concurrency:
  group: create-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # Official-repo releases only. Successful CI push/dispatch on master, or manual dispatch.
    # Forks skip this job (CI already gates artifact upload the same way).
    if: >
      github.repository == 'Kareadita/tach-extension' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read

    steps:
      - name: Resolve source commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_SHA: ${{ github.sha }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$WR_SHA"
            BRANCH="$WR_BRANCH"
          else
            SHA="$GH_SHA"
            BRANCH="$GH_BRANCH"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Source commit: $SHA on $BRANCH"

      - name: Checkout source commit (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect extVersionCode bump
        id: version_check
        env:
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          GRADLE="src/all/kavita/build.gradle"
          FORCE="${FORCE_INPUT}"

          if [ ! -f "$GRADLE" ]; then
            echo "error: $GRADLE not found"
            exit 1
          fi

          CURRENT=$(grep -E '^\s*extVersionCode\s*=' "$GRADLE" | head -1 | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$CURRENT" ]; then
            echo "error: could not read extVersionCode from $GRADLE"
            exit 1
          fi
          echo "Current extVersionCode = $CURRENT"

          # Commits that touched the assignment line (value or formatting).
          # Previous *value* is the newest historical code that differs from CURRENT,
          # so a formatting-only re-touch of the same number cannot mask a real bump.
          mapfile -t BUMP_COMMITS < <(git log -G'extVersionCode\s*=' --pretty=%H -- "$GRADLE")
          THIS_BUMP="${BUMP_COMMITS[0]:-}"
          echo "Newest assignment-line commit: ${THIS_BUMP:-<none>}"

          PREV=""
          PREV_BUMP=""
          for commit in "${BUMP_COMMITS[@]}"; do
            [ -z "$commit" ] && continue
            git cat-file -e "${commit}:${GRADLE}" 2>/dev/null || continue
            val=$(git show "${commit}:${GRADLE}" | grep -E '^\s*extVersionCode\s*=' | head -1 | grep -oE '[0-9]+' | head -1 || true)
            if [ -n "$val" ] && [ "$val" != "$CURRENT" ]; then
              PREV="$val"
              PREV_BUMP="$commit"
              break
            fi
          done
          echo "Previous distinct extVersionCode = ${PREV:-<unknown>} (at ${PREV_BUMP:-<none>})"

          # Notes range: prefer last v* tag on this history (new releases tag master),
          # else previous extVersionCode bump, else a bounded walkback.
          # Tag-anchored range keeps PRs from a cancelled intermediate bump.
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            echo "Notes anchor: last tag $LAST_TAG"
          elif [ -n "$PREV_BUMP" ]; then
            RANGE="${PREV_BUMP}..HEAD"
            echo "Notes anchor: previous bump commit"
          else
            if git rev-parse --verify "HEAD~50" >/dev/null 2>&1; then
              RANGE="HEAD~50..HEAD"
            else
              RANGE="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
            fi
            echo "Notes anchor: walkback fallback"
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Range: $RANGE"
          echo "Range commit count: $(git rev-list --count "$RANGE" 2>/dev/null || echo '?')"
          echo "Latest v* tags: $(git tag -l 'v*' --merged HEAD --sort=-version:refname 2>/dev/null | head -3 | tr '\n' ' ')"

          if [ "$FORCE" = "true" ]; then
            echo "force=true — will create release regardless of bump detection."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREV" ]; then
            echo "Previous extVersionCode unknown — skipping release (fail closed)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" -le "$PREV" ]; then
            echo "extVersionCode did not increase ($PREV -> $CURRENT). Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "extVersionCode bumped ($PREV -> $CURRENT). Will create release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # Same signed APKs CI uploads as individual-apks-*; prefer these over the
      # mutable repo branch so a delayed release for bump N cannot pick N+1's APK.
      - name: Download APKs from triggering CI run
        if: steps.version_check.outputs.should_release == 'true' && github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: individual-apks-*
          merge-multiple: true
          path: ci-apks
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repo branch (APK fallback)
        if: steps.version_check.outputs.should_release == 'true'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: repo
          fetch-depth: 1
          path: repo-branch
          persist-credentials: false

      - name: Find APK matching this source version
        if: steps.version_check.outputs.should_release == 'true'
        id: apk_info
        run: |
          set -euo pipefail
          GRADLE="src/all/kavita/build.gradle"
          EXT=$(grep -E '^\s*extVersionCode\s*=' "$GRADLE" | head -1 | grep -oE '[0-9]+' | head -1)
          KMK=$(grep -E '^\s*kmkVersionCode\s*=' "$GRADLE" | head -1 | grep -oE '[0-9]+' | head -1 || true)
          KMK="${KMK:-0}"
          # Patch matches common.gradle: versionCode = extVersionCode + kmkVersionCode.
          # Major.minor is taken from the built filename (1.4 today, 1.6 after the port).
          CODE=$((EXT + KMK))
          echo "Expected APK patch version: ${CODE} (ext=$EXT kmk=$KMK)"

          find_apk() {
            local root="$1"
            [ -d "$root" ] || return 0
            # CI artifacts keep the Gradle "-release" suffix; publish strips it.
            find "$root" -type f \( \
                -name "tachiyomi-all.kavita-v*.${CODE}.apk" -o \
                -name "tachiyomi-all.kavita-v*.${CODE}-release.apk" \) 2>/dev/null \
              | sort -V \
              | tail -1 || true
          }

          APK_PATH=""
          SOURCE=""
          if [ -d ci-apks ]; then
            APK_PATH=$(find_apk ci-apks)
            [ -n "$APK_PATH" ] && SOURCE="ci-artifacts"
          fi
          if [ -z "$APK_PATH" ]; then
            SEARCH_ROOT="repo-branch/apk"
            [ -d "$SEARCH_ROOT" ] || SEARCH_ROOT="repo-branch"
            APK_PATH=$(find_apk "$SEARCH_ROOT")
            [ -n "$APK_PATH" ] && SOURCE="repo-branch"
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "error: no Kavita APK with patch version ${CODE}"
            echo "--- ci-apks ---"
            find ci-apks -name '*.apk' -type f 2>/dev/null | head -50 || true
            echo "--- repo-branch ---"
            find repo-branch -name '*.apk' -type f 2>/dev/null | head -50 || true
            exit 1
          fi

          VERSION=$(basename "$APK_PATH" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "error: could not parse version from $(basename "$APK_PATH")"
            exit 1
          fi

          # Normalize asset name: publish strips "-release"; match that on GitHub Releases.
          ASSET_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$ASSET_DIR"
          ASSET="$ASSET_DIR/tachiyomi-all.kavita-${VERSION}.apk"
          cp "$APK_PATH" "$ASSET"

          echo "Found APK ($SOURCE): $APK_PATH"
          echo "Release asset: $ASSET"
          echo "Release version tag: $VERSION"
          echo "apk_path=$ASSET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        if: steps.version_check.outputs.should_release == 'true'
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.apk_info.outputs.version }}
        run: |
          set -euo pipefail
          set +e
          OUT=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "Release $VERSION already exists — skipping creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$OUT" | grep -qiE 'not found|HTTP 404|Not Found'; then
            echo "Release $VERSION does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "error: failed to query release $VERSION (not treating as missing):"
            printf '%s\n' "$OUT"
            exit 1
          fi

      - name: Build release notes from PRs since previous release
        if: steps.version_check.outputs.should_release == 'true' && steps.check_release.outputs.exists == 'false'
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RANGE: ${{ steps.version_check.outputs.range }}
        run: |
          set -euo pipefail

          # First-parent: ~one commit per merged PR on master (merge or squash tip).
          PR_NUMBERS=$(
            {
              git log --first-parent "$RANGE" --merges --pretty=%B 2>/dev/null \
                | grep -oE 'Merge pull request #[0-9]+' \
                | grep -oE '[0-9]+' || true
              git log --first-parent "$RANGE" --pretty=%s 2>/dev/null \
                | grep -oE '\(#[0-9]+\)' \
                | grep -oE '[0-9]+' || true

              # Associate only commits that still need it: non-merges without (#N).
              while read -r SHA SUBJ; do
                [ -z "$SHA" ] && continue
                case "$SUBJ" in
                  Merge\ pull\ request\ *) continue ;;
                esac
                case "$SUBJ" in
                  *'(#'[0-9]*')'*) continue ;;
                esac
                set +e
                ASSOC=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" </dev/null 2>&1)
                RC=$?
                set -e
                if [ "$RC" -ne 0 ]; then
                  echo "warning: commits/${SHA}/pulls failed (rc=$RC): $ASSOC" >&2
                  continue
                fi
                echo "$ASSOC" | jq -r '.[].number // empty' 2>/dev/null || true
              # tformat terminates the last line; format does not, so read skips it.
              done < <(git log --first-parent "$RANGE" --pretty=tformat:'%H %s' 2>/dev/null || true)
            } | sort -n -u
          )
          echo "PR candidates in range: $(echo $PR_NUMBERS | tr '\n' ' ')"

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES_FILE"

          # shellcheck disable=SC2086 # intentional word-split of PR list
          for PR in $PR_NUMBERS; do
            echo "Fetching PR #$PR …"
            set +e
            PR_JSON=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,author 2>&1)
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              echo "warning: skipping #$PR (not a PR in $GITHUB_REPOSITORY or not readable): $PR_JSON"
              continue
            fi

            TITLE=$(echo "$PR_JSON" | jq -r '.title // empty')
            BODY=$(echo "$PR_JSON" | jq -r '.body // empty')
            AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login // empty')
            if [ -z "$TITLE" ]; then
              echo "warning: PR #$PR returned empty title — skipping"
              continue
            fi

            CLEAN_BODY=$(printf '%s\n' "$BODY" | tr -d '\r' | sed -E '
              /^Checklist:/,/^$/d
              /^\s*\*\s*\[[ xX]\]/d
              /^\s*-\s*\[[ xX]\]/d
            ' | sed -E '/^[[:space:]]*$/N;/^\n$/d')

            {
              echo "### ${TITLE} (#${PR})"
              echo "*by @${AUTHOR}*"
              echo ""
              printf '%s\n' "${CLEAN_BODY}"
              echo ""
              echo "---"
              echo ""
            } >> "$NOTES_FILE"
          done

          if [ ! -s "$NOTES_FILE" ]; then
            echo "*(No linked PR bodies found for this version bump; see commit log below.)*" > "$NOTES_FILE"
          fi

          COMMITS=$(git log --first-parent "$RANGE" --pretty=tformat:"- %s (%h)" || true)

          {
            echo ""
            echo "<details>"
            echo "<summary>Full commit log since previous release</summary>"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "</details>"
            echo ""
            echo "---"
            echo "*Automatically created on extVersionCode bump*"
          } >> "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "---- release notes preview ----"
          head -80 "$NOTES_FILE" || true

      - name: Create GitHub Release
        if: >
          steps.version_check.outputs.should_release == 'true' &&
          steps.check_release.outputs.exists == 'false' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: Release ${{ steps.apk_info.outputs.version }}
          tag_name: ${{ steps.apk_info.outputs.version }}
          target_commitish: ${{ steps.source.outputs.sha }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: ${{ steps.apk_info.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry-run summary
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == true &&
          steps.version_check.outputs.should_release == 'true' &&
          steps.check_release.outputs.exists == 'false'
        run: |
          echo "Dry run — would have released ${{ steps.apk_info.outputs.version }}"
          echo "APK: ${{ steps.apk_info.outputs.apk_path }} (source=${{ steps.apk_info.outputs.source }})"
          echo "Source: ${{ steps.source.outputs.sha }}"
          echo "Notes file: ${{ steps.notes.outputs.notes_file }}"
